# Yerel geliştirme için Nakama + PostgreSQL.
# Çalıştırma:  docker compose up
# Nakama konsolu: http://127.0.0.1:7351  (kullanıcı: admin, şifre: password)
# Bu ayarlar sadece geliştirme içindir; yayında server_key, http_key ve konsol şifresi değiştirilmeli.
# Şifre sıfırlama e-postası: yayında komuta şunlar eklenir (yoksa kod sunucu günlüğüne yazılır):
#   --runtime.env RESET_MAIL_API_KEY=<resend.com anahtarı> --runtime.env "RESET_MAIL_FROM=Salon <kod@alanadi>"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.22.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name salon1 --database.address postgres:localdb@postgres:5432/nakama
        --logger.level DEBUG --session.token_expiry_sec 7200 --session.refresh_token_expiry_sec 2592000
        --socket.server_key defaultkey --runtime.js_entrypoint index.js
    volumes:
      # Salon oyun modülü. Kaynak server/src; değişince: node build.mjs && docker compose restart nakama
      - ./modules:/nakama/data/modules
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"

volumes:
  pgdata:
